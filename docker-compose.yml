# Runs a single local Qdrant server. No cloud account needed.
services:
  qdrant:
    # Pinned to an exact version so a fresh clone gets the same server
    # that qdrant-client in requirements.txt was tested against.
    image: qdrant/qdrant:v1.20.2
    container_name: qdrant-capstone
    ports:
      - "6333:6333"   # REST API + web dashboard (what our Python client uses)
      - "6334:6334"   # gRPC API (not used by our scripts, but exposed per the brief)
    volumes:
      # Keep Qdrant's data on disk in the repo folder, so collections
      # survive `docker compose down` / restarts. Git-ignored.
      - ./qdrant_storage:/qdrant/storage
